# The 2123 Project - Spring Boot Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:project2123db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.edu.trincoll.project2123=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# AI Configuration (OpenAI for Image Generation)
# Set your OpenAI API key as an environment variable:
# OPENAI_API_KEY=your-api-key
# Or uncomment and set the key below (not recommended for production)
# spring.ai.openai.api-key=your-api-key-here

# OpenAI Settings for Image Generation
spring.ai.openai.api-key=${OPENAI_API_KEY:your-openai-api-key-here}
spring.ai.openai.image.model=dall-e-3
spring.ai.openai.image.size=1024x1024
spring.ai.openai.image.quality=standard
spring.ai.openai.image.n=1

# Application Information
spring.application.name=The 2123 Project
info.app.name=The 2123 Project
info.app.description=Trinity College Bicentennial Vision Platform
info.app.version=1.0.0
